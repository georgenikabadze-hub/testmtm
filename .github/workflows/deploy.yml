name: Deploy

# Controls when the workflow will run
on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: action/setup-python@v5
        with:
          python-version: "3.12"
          
      - uses: withastro/action@v3
        with:
          package-manager: npm
          node-version: 22
          path: ./testmtm

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
      uses: action/deploy-page@v4
      
